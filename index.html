<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="NutriHome: menú semanal, recetas, despensa y lista de compra inteligente." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>NutriHome</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Tu cocina, organizada</p>
        <h1>NutriHome</h1>
      </div>
      <button id="installBtn" class="ghost hidden">Instalar</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="plan" class="nav-item active"><span>📅</span><small>Menú</small></button>
      <button data-route="recipes" class="nav-item"><span>🍲</span><small>Recetas</small></button>
      <button data-route="pantry" class="nav-item"><span>🏠</span><small>Despensa</small></button>
      <button data-route="shopping" class="nav-item"><span>🛒</span><small>Compra</small></button>
      <button data-route="profile" class="nav-item"><span>👤</span><small>Perfil</small></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
