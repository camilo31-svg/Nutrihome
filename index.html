<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8f3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>NutriHome</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Tu cocina, organizada</p>
        <h1 id="screen-title">Inicio</h1>
      </div>
      <button class="icon-btn" id="install-btn" title="Instalar app" hidden>↧</button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Inicio</small></button>
      <button data-route="week" class="nav-item"><span>▦</span><small>Semana</small></button>
      <button data-route="recipes" class="nav-item"><span>◉</span><small>Recetas</small></button>
      <button data-route="pantry" class="nav-item"><span>▤</span><small>Despensa</small></button>
      <button data-route="shopping" class="nav-item"><span>✓</span><small>Compra</small></button>
      <button data-route="profile" class="nav-item"><span>⚙</span><small>Perfil</small></button>
    </nav>
  </div>

  <dialog id="recipe-dialog" class="sheet"></dialog>
  <dialog id="generic-dialog" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
